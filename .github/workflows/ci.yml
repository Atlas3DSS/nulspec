name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Reconstruct pinned upstream source
        run: |
          git clone --filter=blob:none \
            https://github.com/rezwanh001/SLM-RL-Agents.git \
            paper_repro/SLM-RL-Agents
          git -C paper_repro/SLM-RL-Agents checkout --detach \
            64acb621037c711395f2d77516bee70d8a49b819
          git -C paper_repro/SLM-RL-Agents apply \
            "$GITHUB_WORKSPACE/patches/2607.25091/reproduction.patch"
          git -C paper_repro/SLM-RL-Agents apply --reverse --check \
            "$GITHUB_WORKSPACE/patches/2607.25091/reproduction.patch"

      - name: Install frozen test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-test.txt

      - name: Validate frozen protocol
        run: python scripts/validate_protocol.py --skip-data

      - name: Enforce repository hygiene
        run: python scripts/check_repository_hygiene.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: |
          git ls-files -z '*.py' |
            xargs -0 -r python -m py_compile

      - name: Check shell syntax
        run: |
          git ls-files -z '*.sh' |
            xargs -0 -r -n1 bash -n

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "*.json"]
          ).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode())
              json.loads(path.read_text())
          PY

      - name: Check whitespace
        run: git log --check --oneline

  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate evidence data
        run: npm run validate:data

      - name: Check types and style
        run: |
          npm run typecheck
          npm run lint

      - name: Build managed-hosting bundle
        run: npm run build:cloudflare

      - name: Build static droplet release
        run: npm run build:static

      - name: Audit production dependencies
        run: npm audit --omit=dev
