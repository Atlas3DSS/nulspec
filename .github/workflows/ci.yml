name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate frozen protocol
        run: python scripts/validate_protocol.py --skip-data --skip-upstream

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: |
          python -m compileall -q reprolab scripts extension paper_repro

      - name: Check shell syntax
        run: |
          find scripts paper_repro extension infra \
            -type f -name '*.sh' -print0 |
            xargs -0 -r -n1 bash -n

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ignored = {
              "paper_repro/outputs",
              "paper_repro/outputs_corrected",
              "paper_repro/full_matrix_runs",
              "paper_repro/data_release",
              "extension/matrix_runs",
          }
          for path in Path(".").rglob("*.json"):
              if any(str(path).startswith(prefix) for prefix in ignored):
                  continue
              json.loads(path.read_text())
          PY

      - name: Verify upstream patch applies
        run: |
          git clone --filter=blob:none \
            https://github.com/rezwanh001/SLM-RL-Agents.git \
            /tmp/SLM-RL-Agents
          git -C /tmp/SLM-RL-Agents checkout --detach \
            64acb621037c711395f2d77516bee70d8a49b819
          git -C /tmp/SLM-RL-Agents apply --check \
            "$GITHUB_WORKSPACE/patches/2607.25091/reproduction.patch"

      - name: Check whitespace
        run: git log --check --oneline
