<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">H3 wall-time comparison</title>
  <desc id="description">Dense and sparse H3 schedules compared in seconds. Sparse schedules save between 24.5 and 57.6 seconds in the matched four-step and eight-step groups.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14212a"/>
      <stop offset="1" stop-color="#080d11"/>
    </linearGradient>
    <linearGradient id="sparse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce8ff"/>
      <stop offset="1" stop-color="#72e4ad"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="100" cy="4" r="240" fill="#5ce8ff" opacity="0.055"/>
  <path d="M56 54H1144" stroke="#263744"/>

  <text x="58" y="40" fill="#5ce8ff" font-family="ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="4">NULSPEC / H3 WALL TIME</text>
  <text x="58" y="116" fill="#e6f7fb" font-family="Inter, system-ui, sans-serif" font-size="47" font-weight="760" letter-spacing="-2">Sparsity returned time to the clock.</text>
  <text x="60" y="154" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="20">Same first frame, prompt, seed, checkpoint, resolution, and duration.</text>

  <g transform="translate(58 204)">
    <text x="0" y="0" fill="#e6f7fb" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">4-step family</text>
    <text x="0" y="31" fill="#9bb0ba" font-family="ui-monospace, monospace" font-size="14">WALL TIME / SECONDS</text>

    <text x="0" y="78" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="16">Dense 4</text>
    <rect x="116" y="57" width="380" height="28" rx="3" fill="#304250"/>
    <text x="506" y="78" fill="#e6f7fb" font-family="ui-monospace, monospace" font-size="16">99.8</text>

    <text x="0" y="126" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="16">Sparse 2→2</text>
    <rect x="116" y="105" width="286" height="28" rx="3" fill="url(#sparse)"/>
    <text x="412" y="126" fill="#e6f7fb" font-family="ui-monospace, monospace" font-size="16">75.2</text>
    <text x="474" y="126" fill="#72e4ad" font-family="ui-monospace, monospace" font-size="14">−24.5 s</text>

    <text x="0" y="174" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="16">Sparse 2→4</text>
    <rect x="116" y="153" width="361" height="28" rx="3" fill="url(#sparse)"/>
    <text x="487" y="174" fill="#e6f7fb" font-family="ui-monospace, monospace" font-size="16">94.7</text>
    <text x="549" y="174" fill="#72e4ad" font-family="ui-monospace, monospace" font-size="14">−5.0 s</text>
  </g>

  <path d="M600 204V552" stroke="#263744"/>

  <g transform="translate(640 204)">
    <text x="0" y="0" fill="#e6f7fb" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">8-step family</text>
    <text x="0" y="31" fill="#9bb0ba" font-family="ui-monospace, monospace" font-size="14">WALL TIME / SECONDS</text>

    <text x="0" y="78" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="16">Dense 8</text>
    <rect x="116" y="57" width="380" height="28" rx="3" fill="#304250"/>
    <text x="506" y="78" fill="#e6f7fb" font-family="ui-monospace, monospace" font-size="16">184.3</text>

    <text x="0" y="126" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="16">All sparse</text>
    <rect x="116" y="105" width="261" height="28" rx="3" fill="url(#sparse)"/>
    <text x="387" y="126" fill="#e6f7fb" font-family="ui-monospace, monospace" font-size="16">126.8</text>
    <text x="457" y="126" fill="#72e4ad" font-family="ui-monospace, monospace" font-size="14">−57.6 s</text>

    <text x="0" y="174" fill="#9bb0ba" font-family="Inter, system-ui, sans-serif" font-size="16">Sparse 4→4</text>
    <rect x="116" y="153" width="307" height="28" rx="3" fill="url(#sparse)"/>
    <text x="433" y="174" fill="#e6f7fb" font-family="ui-monospace, monospace" font-size="16">149.1</text>
    <text x="503" y="174" fill="#72e4ad" font-family="ui-monospace, monospace" font-size="14">−35.2 s</text>
  </g>

  <path d="M56 574H1144" stroke="#263744"/>
  <text x="58" y="607" fill="#9bb0ba" font-family="ui-monospace, monospace" font-size="14">MINIMAX H3 FL2VA · 768² · 15.08 S · EULER / SIMPLE</text>
</svg>
